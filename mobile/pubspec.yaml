name: parksync
description: ParkSync — Smart Parking Marketplace for India.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  geolocator: ^10.1.0
  dio: ^5.3.3
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  shared_preferences: ^2.2.1
  flutter_svg: ^2.0.7
  cached_network_image: ^3.3.0
  intl: ^0.20.2
  go_router: ^11.0.1
  google_fonts: ^6.1.0
  lottie: ^3.1.2
  country_code_picker: ^3.0.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
